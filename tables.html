<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        body {
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        table{
            width: 63%;
            border: 1px solid black;
            margin: auto;
            border-collapse: collapse;
            /* merge borders */
        }
        th{
            color: #dd1b1b;
            border: 1px solid black;
            padding: 12px 6px;
            text-align: left;
        }
        td{
            color: #110e0e;
            border: 1px solid black;
            padding: 12px 6px;
            text-align: left;
        }
        .salary{
            color: aqua;
            font-weight: bold;
        }
        /* CSS Frameworks  Bootstrap */
    </style>
</head>
<body>
    <table>
        <thead>
          <tr> 
            <th>First Name</th>
            <th>Last Name</th>
            <th>City</th>
            <th>Age</th>
            <th>Salary</th>
          </tr>
        </thead>
        <tbody>
            <tr>
                <td>Jane</td>
                <td>Mwangi</td>
                <td>Nairobi</td>
                <td>21</td>
                <td class="salary">60000</td>
            </tr>
            <tr>
                <td>Jack</td>
                <td>Juma</td>
                <td>Mombasa</td>
                <td>24</td>
                <td class="salary">40000</td>
            </tr>
            <tr>
                <td>John</td>
                <td>Otieno</td>
                <td>Nakuru</td>
                <td>26</td>
                <td class="salary">50000</td>
            </tr>
            <tr>
                <td>Jill</td>
                <td>Wanjiku</td>
                <td>Eldoret</td>
                <td>25</td>
                <td class="salary">80000</td>
            </tr>


        </tbody>
    </table>

    <!-- List Unordered -->
     <ul>
        <li>Nairobi</li>
        <li>Mombasa</li>
        <li>Kisumu</li>
        <li>Eldoret</li>
        <li>Nyeri</li>
     </ul>
     
</body>
</html>
